<style>
/* Layout: right-hand rail (RTL) with role switch + views, main column of airy working panels. Light cool-white neutrals, blueprint-blue accent. */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --sunk:#F2F0EC; --ink:#1C1A16; --muted:#6E685E; --line:#E6E2DA;
  --accent:#94701F; --accent-ink:#FFFFFF; --accent-soft:#F7EEDB; --accent-2:#E3C17C; --gold:#C9983F; --brand-bg:#14110C;
  --ok:#23845A; --ok-soft:#E3F4EC; --warn:#A8670E; --warn-soft:#FCF1DE; --bad:#B8402F; --bad-soft:#FBE7E3;
  --grid:rgba(148,112,31,.07);
  --shadow:0 1px 2px rgba(23,33,44,.04),0 6px 20px rgba(23,33,44,.05);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100F0D; --surface:#1A1815; --sunk:#141210; --ink:#ECE7DE; --muted:#A39B8C; --line:#2E2A23;
  --accent:#D9AC5A; --accent-ink:#1A1408; --accent-soft:#2E2617; --accent-2:#7A5F2E; --gold:#D9AC5A; --brand-bg:#0A0907;
  --ok:#5CC48F; --ok-soft:#15302A; --warn:#E6AA4F; --warn-soft:#382A14; --bad:#F2806D; --bad-soft:#3B1E1A;
  --grid:rgba(217,172,90,.07); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100F0D; --surface:#1A1815; --sunk:#141210; --ink:#ECE7DE; --muted:#A39B8C; --line:#2E2A23;
  --accent:#D9AC5A; --accent-ink:#1A1408; --accent-soft:#2E2617; --accent-2:#7A5F2E; --gold:#D9AC5A; --brand-bg:#0A0907;
  --ok:#5CC48F; --ok-soft:#15302A; --warn:#E6AA4F; --warn-soft:#382A14; --bad:#F2806D; --bad-soft:#3B1E1A;
  --grid:rgba(217,172,90,.07); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-size:19px}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-3px}
.lbl{font-size:11.5px;color:var(--muted);letter-spacing:.02em;padding:0 6px;margin-bottom:6px;font-weight:600}
.field{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.roles .role:last-child:nth-child(odd){grid-column:1/-1}
.role{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 6px;cursor:pointer;font-size:12.5px;text-align:center}
.role[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.views{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted)}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.save{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 6px}
.sdot{width:8px;height:8px;border-radius:99px;background:var(--line);flex:none}
.save[data-s="saved"] .sdot{background:var(--ok)} .save[data-s="saving"] .sdot{background:var(--accent)}
.save[data-s="error"] .sdot,.save[data-s="local"] .sdot{background:var(--warn)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 6px;border-top:1px solid var(--line)}

main{padding-block:28px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
.grid{gap:20px}
.nav{border-radius:10px}
.role{border-radius:10px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:24px}
.head p{margin:2px 0 0;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:15.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi b{font-family:var(--f-num);font-size:22px;font-weight:500;direction:ltr;text-align:right}
.kpi small{color:var(--muted);font-size:12px}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.ok i{background:var(--ok)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 110px;align-items:center;gap:10px;font-size:13px}
.bar-row .track{height:14px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bar-row .track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent-soft);border-inline-end:2px solid var(--accent)}
.bar-row .track u{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);text-decoration:none}
.bar-row .v{text-align:left;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}

.insight{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-size:13.5px}
.insight + .insight{margin-top:8px}
.insight .dot{width:8px;height:8px;border-radius:99px;margin-top:7px;flex:none;background:var(--accent)}
.insight.warn .dot{background:var(--warn)} .insight.bad .dot{background:var(--bad)} .insight.ok .dot{background:var(--ok)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sunk);color:var(--muted);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
tfoot td{background:var(--sunk);font-weight:600}
td.n{text-align:left}
.price-in{width:96px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--f-num);direction:ltr}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.drop{border:1.5px dashed var(--accent);border-radius:var(--r);padding:28px 18px;text-align:center;cursor:pointer;
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.drop:hover,.drop.over{background-color:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:4px}
.drop p{margin:0;color:var(--muted);font-size:13px}
.drop input{display:none}

.steps{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.step i{width:18px;height:18px;border-radius:99px;border:2px solid var(--line);flex:none}
.step.run{color:var(--ink)} .step.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--ink)} .step.done i{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.step.run i{animation:none}}

.plan{background:var(--sunk);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.plan img{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--sunk)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:13.5px;flex-wrap:wrap}

.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:6px}

.form{display:grid;gap:10px}
.form textarea{min-height:80px;resize:vertical}
.log{display:flex;flex-direction:column;gap:10px}
.log-item{border-inline-start:3px solid var(--accent);padding:4px 12px}
.log-item small{color:var(--muted)}

.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
.yes{color:var(--ok);font-weight:600} .no{color:var(--muted)}
.ro-note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* القراءة الذكية */
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sel-sm{padding:5px 8px;width:auto;max-width:100%;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--sunk);border:1px solid var(--line);border-radius:10px}
.thumb figcaption{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .sel-sm{width:100%}
.m-in{width:84px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--f-num);direction:ltr}
.how{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--sunk)}
.how summary{cursor:pointer;font-weight:500}
.how ul{margin:10px 0 6px;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.howto{margin:12px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.inv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:18px;align-items:start}
.inv-prev img{max-height:520px}
.inv-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.inv-meta div{background:var(--sunk);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.inv-meta span{font-size:12px;color:var(--muted)}
.inv-meta b{font-weight:500;overflow-wrap:anywhere}
@media (max-width:900px){.inv-grid{grid-template-columns:minmax(0,1fr)}}

/* لوحة التحكم */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hello h1{font-size:26px;font-weight:600}
.hello p{margin:4px 0 0;color:var(--muted)}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px;margin-bottom:8px}
.kpi{gap:4px}
.kpi-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.kpi-ic svg{width:19px;height:19px}
.kpi b{font-size:21px}
.tl{display:flex;flex-direction:column;gap:12px}
.tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tl-track{position:relative;height:12px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.tl-track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.tl-track b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.tl-track b::after{content:"اليوم";position:absolute;top:-20px;transform:translateX(50%);font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.tl-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tl-legend b{color:var(--ink);font-weight:500}
.budget{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
.donut{width:150px;height:150px}
.cats{display:flex;flex-direction:column;gap:14px;min-width:0}
.cat-h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.cat-h .num{color:var(--muted);font-size:12.5px}
.meter{height:8px;border:0}
.cols{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.col-bar{flex:1;width:100%;max-width:56px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.col-bar i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0;opacity:.85}
.col:hover .col-bar i{opacity:1}
.col-v{font-size:12px;color:var(--muted)}
.col-l{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.ai-card{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.insight{background:var(--surface)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.feed li:not(:last-child)::before{content:"";position:absolute;inset-inline-start:6px;top:16px;bottom:0;width:2px;background:var(--line)}

.feed-t{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:13.5px}

.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;font-family:var(--f-num);margin-inline-start:auto}

.tg{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px}

.brand-mark{background:none;width:38px;height:38px}
.brand-mark svg{width:38px;height:38px}
.cobrand{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.cobrand img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.cobrand span{font-size:11.5px;color:var(--muted);line-height:1.35}
.cobrand b{display:block;color:var(--ink);font-size:13px}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.me img{width:30px;height:30px;border-radius:99px;flex:none}
.me b{font-size:13px;display:block;line-height:1.3}
.me span{font-size:11.5px;color:var(--muted)}
.gate{max-width:520px;margin:6vh auto 0;text-align:center}

.mem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);flex-wrap:wrap}

</style>

<div class="app">

let PRICES=JSON.parse(JSON.stringify(DEFAULT_PRICES));
const state={role:'pm',view:'dashboard',project:null,floorTab:'all',projects:{},loaded:false,wtab:'summary',priceKey:null};
const P=()=>state.projects[state.project];
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const sar=n=>fmt(n)+' ر.س';
const total=it=>it.qty.reduce((a,b)=>a+b,0)+(+it.coQty||0);
const can=a=>!!(state.role&&ROLES[state.role].edit[a]);
function totals(){
  const items=P().items;let est=0,spent=0;
  items.forEach(it=>{const pr=PRICES[it.key].price;est+=total(it)*pr;spent+=Math.min(it.bought,total(it))*pr});
  const invoiced=P().invoices.reduce((s,i)=>s+i.total,0);
  return {est,spent,invoiced,remain:est-spent};
}
const h=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

function renderRail(){

  document.getElementById('rolesBox').hidden=!canSwitch();

  if(!state.role){document.getElementById('nav').innerHTML='';document.getElementById('roles').innerHTML='';return}

  document.getElementById('roles').innerHTML=Object.keys(ROLES).map(k=>`<button class="role" data-role="${k}" aria-pressed="${k===state.role}">${ROLE_SHORT[k]}</button>`).join('');

function insights(){
  const p=P(),out=[];
  p.items.forEach(it=>{const t=total(it),pct=it.bought/t;const pr=PRICES[it.key];
    if(it.bought>t) out.push(['bad',`المشتريات من «${pr.name}» تجاوزت الكمية المقدّرة بـ ${fmt(it.bought-t,1)} ${pr.unit}. راجع الفواتير أو حدّث جدول الكميات.`]);
    else if(pct>.85&&pct<1) out.push(['warn',`تبقّى ${fmt(t-it.bought,1)} ${pr.unit} فقط من «${pr.name}» (${fmt(pct*100)}% مستهلك).`]);
  });
  const ups=Object.keys(PRICES).map(k=>[k,priceStats(k)]).filter(([k,st])=>st.chg!=null&&st.chg>=1.5);
  if(ups.length) out.push(['warn',`ارتفع سعر الشراء في آخر فاتورة: ${ups.map(([k,st])=>`${PRICES[k].name} (+${fmt(st.chg,1)}%)`).join('، ')}. يُنصح بتثبيت عروض الأسعار.`]);
  const pend=(p.works||[]).filter(w=>w.status==='submitted');
  if(pend.length) out.push(['',`${pend.length} تقرير أعمال منفذة بقيمة ${sar(pend.reduce((s,w)=>s+workCalc(p,w).gross,0))} بانتظار اعتماد مدير المشروع.`]);
  const tt=totals();
  if(tt.invoiced>tt.spent*1.0) out.push(['ok',`متوسط أسعار الشراء الفعلية أقل من السعر التقديري بنسبة ${fmt((1-tt.invoiced/ (tt.spent||1))*-100,1)}%.`]);
  return out.slice(0,4);
}

function schedule(p){
  const s=Date.parse(p.start),e=Date.parse(p.end),now=Date.now();
  if(!s||!e||e<=s) return null;
  const elapsed=Math.max(0,Math.min(100,(now-s)/(e-s)*100));
  const left=Math.max(0,Math.ceil((e-now)/864e5));
  return {elapsed,left,gap:prog(p)-elapsed};
}
function donut(pct){
  const r=46,c=2*Math.PI*r,v=Math.max(0,Math.min(100,pct));
  return `<svg viewBox="0 0 120 120" class="donut" aria-label="نسبة الصرف ${fmt(v)}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" fill="var(--ink)" font-size="20" font-family="IBM Plex Mono, monospace">${fmt(v)}%</text>
    <text x="60" y="78" text-anchor="middle" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Sans Arabic, sans-serif">مصروف</text></svg>`;
}
function activity(p){
  const ev=[...p.invoices.map(i=>({date:i.date,kind:'inv',t:`فاتورة ${i.no}`,s:`${h(i.vendor)} · ${sar(i.total)}`})),
            ...p.reports.map(r=>({date:r.date,kind:'rep',t:`تقرير يومي — ${h(r.by)}`,s:h(r.text)}))]
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  if(!ev.length) return '<p class="ro-note">لا يوجد نشاط بعد.</p>';
  return `<ol class="feed">${ev.map(e=>`<li class="${e.kind}"><span class="feed-dot"></span><div><div class="feed-t">${e.t}<span class="num">${e.date}</span></div><div class="feed-s">${e.s}</div></div></li>`).join('')}</ol>`;
}

let pdfjsP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej({code:'unsupported',message:'تعذّر تحميل قارئ PDF — ارفع الملف كصورة.'});document.head.appendChild(s)})}
function loadPdfjs(){
  // نحمّل العامل أولاً ليعمل pdf.js داخل الصفحة نفسها بدون Web Worker خارجي
  if(!pdfjsP){const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfjsP=loadScript(b+'pdf.worker.min.js').then(()=>loadScript(b+'pdf.min.js')).then(()=>window.pdfjsLib);
    pdfjsP.catch(()=>{pdfjsP=null})}
  return pdfjsP;
}
const canvasBlob=(c,q=.9)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function pdfPages(file,max){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(let i=1;i<=Math.min(doc.numPages,max);i++){
    const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:Math.min(4,2400/Math.max(v1.width,v1.height))});
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise;
    out.push({name:doc.numPages>1?`${file.name} — ص ${i}`:file.name,blob:await canvasBlob(c)});
  }
  return out;
}
async function fileToPages(file,max){
  const n=file.name.toLowerCase();
  if(file.type==='application/pdf'||n.endsWith('.pdf')) return pdfPages(file,max);
  if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return [{name:file.name,blob:file}];
  if(file.type.startsWith('image/')){const bm=await createImageBitmap(file);const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);return [{name:file.name,blob:await canvasBlob(c)}]}
  throw {code:'unsupported',message:/\.(dwg|dxf)$/.test(n)?'ملفات DWG/DXF غير مدعومة مباشرة — صدّرها PDF من أوتوكاد ثم ارفعها.':'صيغة غير مدعومة — ارفع PDF أو صورة JPG/PNG.'};
}
// أربع لقطات مكبّرة للوحة حتى تُقرأ الأبعاد الصغيرة (الترتيب: أعلى يمين، أعلى يسار، أسفل يمين، أسفل يسار)
async function tiles(blob){
  const bm=await createImageBitmap(blob);const W=bm.width,H=bm.height,ov=.06,out=[];
  for(const [fx,fy] of [[.5,0],[0,0],[.5,.5],[0,.5]]){
    const x=Math.max(0,(fx-ov)*W),y=Math.max(0,(fy-ov)*H),w=Math.min(W-x,(.5+2*ov)*W),hh=Math.min(H-y,(.5+2*ov)*H);
    const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(hh);c.getContext('2d').drawImage(bm,x,y,w,hh,0,0,c.width,c.height);
    out.push(await canvasBlob(c));
  }
  return out;
}

let analysis=null; // {stage:'prep'|'ready'|'reading'|'review'|'error', pages:[{name,blob,url,floor}], M, notes, summary, error, msg, ctl}
const MF=[['area','المساحة','م²'],['ext','جدران خارجية','م.ط'],['int','جدران داخلية','م.ط'],['h','ارتفاع الدور','م'],['cols','الأعمدة','عدد'],['rooms','الغرف','عدد'],['wet','حمامات ومطابخ','عدد']];
const isAnnex=(p,i)=>p.annex&&i===p.floors.length-1&&i>1;
function defaultM(p){
  const s=p.scale||1,r=Math.sqrt(s);
  return p.floors.map((f,i)=>i===0?null:isAnnex(p,i)
    ?{area:r1(110*s),ext:r1(42*r),int:r1(18*r),h:3.2,cols:Math.round(10*s),rooms:2,wet:2,src:'assumed'}
    :{area:r1(310*s),ext:r1(72*r),int:r1(95*s),h:3.2,cols:Math.round(24*s),rooms:Math.round(6*s),wet:Math.round(3*s),src:'assumed'});
}
// معاملات تقريبية لمبنى سكني خرساني بجدران بلوك — للتقدير الأولي وتحتاج مراجعة مهندس
function takeoff(p,M){
  const n=p.floors.length,g=M[1]||{area:0};const q={};Object.keys(BASE).forEach(k=>q[k]=new Array(n).fill(0));
  q.concrete[0]=g.area*.32;q.rebar[0]=q.concrete[0]*.09;q.cement[0]=g.area*.4;q.sand[0]=g.area*.13;q.water[0]=g.area*1.05;
  for(let i=1;i<n;i++){const m=M[i];if(!m)continue;const wallA=(m.ext+m.int)*m.h*.85;
    q.concrete[i]=m.area*.24+m.cols*.18*m.h;q.rebar[i]=q.concrete[i]*.11;q.block[i]=wallA*12.5;q.cement[i]=wallA*.6;q.sand[i]=wallA*.05;
    q.plaster[i]=(2*m.ext+2*m.int)*m.h*.85+m.area;q.tile[i]=m.area*.9;q.paint[i]=(m.ext+2*m.int)*m.h*.85+m.area;
    q.elec[i]=m.rooms*7+m.wet*3+m.area*.04;q.plumb[i]=m.wet*6+2}
  const top=p.annex&&n>2?n-2:n-1;q.water[n-1]+=((M[top]&&M[top].area)||0)*1.1;
  const old=p.items||[];
  return Object.keys(BASE).map(k=>{const o=old.find(x=>x.key===k);return {key:k,qty:q[k].map(v=>k==='rebar'?r1(v):Math.round(v)),bought:o?o.bought:0,coQty:o&&o.coQty||0}}).concat(old.filter(x=>!BASE[x.key]));
}
function drawPrompt(p,desc,hints){
  return `You are an experienced quantity surveyor reading construction drawings of a residential building in Saudi Arabia (reinforced concrete frame, block walls).
Project floors, use these exact names: ${p.floors.slice(1).map(f=>`"${f}"`).join(', ')}.
Images:
${desc.join('\n')}
The user says: ${hints}.

For each PAGE (not each image), read the title block, scale, dimension strings, grid lines, room labels and column marks, then report:
- gross_area_m2: built-up area of that floor plan
- external_wall_length_m and internal_wall_length_m: total centreline length of block walls
- wall_height_m: floor-to-floor height (3.2 if not shown)
- columns: number of columns
- rooms: habitable rooms (bedrooms, majlis, living, dining, maid's room)
- wet_rooms: bathrooms + kitchens + laundry
Prefer written dimensions; when missing, scale from the drawing and say so in notes with lower confidence. A page that is not a floor plan (section, elevation, structural detail) gets its type and only the values it shows.

Reply with only this JSON:
{"pages":[{"page":1,"title":"","type":"floor_plan|structural|section|elevation|site|other","floor":"one of the floor names or null","scale":"1:100 or null","gross_area_m2":0,"external_wall_length_m":0,"internal_wall_length_m":0,"wall_height_m":3.2,"columns":0,"rooms":0,"wet_rooms":0,"confidence":"high|medium|low","notes":"one or two short Arabic sentences: what you read and what you assumed"}],
"summary":"one short Arabic sentence"}
Use null for anything you cannot determine. Numbers are plain numbers.`;
}
async function startDrawings(files){
  const p=P();const a={stage:'prep',pages:[]};analysis=a;render();
  const max=Math.max(1,Math.min(6,(AI.limits&&AI.limits.images&&AI.limits.images.maxCount)||6));
  try{
    for(const f of files){if(a.pages.length>=max)break;const pg=await fileToPages(f,max-a.pages.length);a.pages.push(...pg)}
    if(analysis!==a) return;
    a.pages.forEach(pg=>{pg.url=URL.createObjectURL(pg.blob);pg.floor=''});
    a.stage='ready';a.cut=files.length>0&&a.pages.length>=max;render();
  }catch(e){if(analysis!==a)return;a.stage='error';a.error=e&&e.message||'تعذّر فتح الملف.';render()}
}
async function readDrawings(){
  const p=P(),a=analysis;if(!a||!aiReady())return;
  const max=AI.limits.images.maxCount||5;const zoom=a.pages.length*5<=max;
  a.stage='reading';a.msg='تجهيز الصور للقراءة…';render();
  try{
    const imgs=[],desc=[];
    for(const [i,pg] of a.pages.entries()){
      if(imgs.length>=max)break;
      imgs.push(pg.blob);desc.push(`Image ${imgs.length}: page ${i+1} (${pg.name}), whole sheet`);
      if(zoom){const t=await tiles(pg.blob);const s=imgs.length+1;imgs.push(...t);desc.push(`Images ${s}-${s+3}: page ${i+1} zoomed quarters, in order top-right, top-left, bottom-right, bottom-left`)}
    }
    if(analysis!==a) return;
    const hints=a.pages.map((pg,i)=>pg.floor?`page ${i+1} is "${pg.floor}"`:'').filter(Boolean).join('; ')||'no hints';
    a.msg='يقرأ الذكاء الاصطناعي الأبعاد والجدران والأعمدة… قد يستغرق دقيقة إلى دقيقتين';a.ctl=new AbortController();render();
    const res=await AI.sample.json(drawPrompt(p,desc,hints),{images:imgs,modelTier:'complex',signal:a.ctl.signal});
    if(analysis!==a) return;
    applyDrawResult(p,a,res||{});a.stage='review';render();
  }catch(e){
    if(analysis!==a) return;
    if(e&&e.code==='cancelled'){a.stage='ready';render();return}
    a.stage='error';a.error=aiErr(e);render();
  }
}
function applyDrawResult(p,a,res){
  const pages=Array.isArray(res.pages)?res.pages:[];
  const M=p.takeoff?clone(p.takeoff):defaultM(p);
  const num=v=>{const x=Number(v);return isFinite(x)&&x>0?x:null};
  const best={};let hAll=null;
  pages.forEach((r,idx)=>{
    const pg=a.pages[(Number(r.page)||idx+1)-1];const fl=(pg&&pg.floor)||r.floor;const i=p.floors.indexOf(fl);
    if(num(r.wall_height_m)) hAll=num(r.wall_height_m);

const toLatin=s=>String(s||'').replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).replace(/[۰-۹]/g,d=>FA_D.indexOf(d));
// توحيد رقم الفاتورة: أرقام عربية→لاتينية، حذف المسافات والرموز والبادئات (INV، No…) والأصفار البادئة
const normNo=s=>toLatin(s).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(INVOICE|INV|TAX|BILL|NO)+/,'').replace(/^0+/,'');
const digitsNo=s=>toLatin(s).replace(/\D/g,'').replace(/^0+/,'');
const normVendor=s=>String(s||'').replace(/\(.*?\)/g,'').replace(/^\s*(شركة|مؤسسة|مصنع|مكتب|مجموعة)\s+/,'').replace(/[^\p{L}\p{N}]/gu,'').replace(/ال/g,'').toLowerCase();

  const n=normNo(inv.no),d=digitsNo(inv.no);let maybe=null;
  for(const c of cands){
    const ref=`${c.no} · ${c.date} · ${c.pname}`;
    if(inv.hash&&c.hash===inv.hash) return {level:'sure',why:'الملف نفسه مسجّل مسبقاً',ref};
    const sv=sameVendor(inv.vendor,c.vendor);

      maybe=maybe||{level:'maybe',why:'نفس رقم الفاتورة لكن باسم مورد مختلف',ref};continue}
    if(d.length>=3&&digitsNo(c.no)===d&&sv) return {level:'sure',why:'نفس رقم الفاتورة (مكتوب بصيغة مختلفة) ونفس المورد',ref};

async function fileHash(f){try{const b=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return ''}}

function priceHist(key){
  const out=[];
  Object.values(state.projects).forEach(p=>(p.invoices||[]).forEach(i=>(i.items||[]).forEach(x=>{
    if(x.key===key&&x.price>0) out.push({date:i.date,no:i.no,vendor:i.vendor,pname:p.name,qty:x.qty,price:x.price})})));
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function priceStats(key){
  const hs=priceHist(key);if(!hs.length) return {n:0,hs};
  const q=hs.reduce((s,x)=>s+x.qty,0);const avg=q?hs.reduce((s,x)=>s+x.price*x.qty,0)/q:hs.reduce((s,x)=>s+x.price,0)/hs.length;
  const last=hs[hs.length-1],prev=hs.length>1?hs[hs.length-2]:null;
  return {n:hs.length,hs,avg,last,min:Math.min(...hs.map(x=>x.price)),max:Math.max(...hs.map(x=>x.price)),chg:prev?(last.price/prev.price-1)*100:null};
}

  if(!inv.dateOk) is.push(['warn','لم يُقرأ تاريخ الفاتورة — استُخدم تاريخ اليوم.']);
  if(!inv.lines.length) is.push(['bad','لم يُعثر على بنود في الفاتورة.']);
  const low=inv.lines.filter(l=>l.conf&&l.conf!=='high');
  if(low.length) is.push(['warn',`${low.length} بند قُرئ بثقة غير عالية (معلَّم في الجدول).`]);
  const sum=inv.lines.reduce((s,l)=>s+l.lineTotal,0)+inv.vat;
  if(inv.totalRead&&inv.lines.length&&Math.abs(sum-inv.total)>Math.max(2,inv.total*.01)) is.push(['warn',`مجموع البنود مع الضريبة (${sar(sum)}) لا يطابق إجمالي الفاتورة (${sar(inv.total)}).`]);

    if(it&&total(it)-it.bought-used[l.key]<0) is.push(['warn',`«${pr.name}» سيتجاوز الكمية المقدّرة في جدول الكميات.`]);

const PH={assets:undefined,list:[],geo:null,geoState:'idle'};
async function assetsNS(){if(PH.assets===undefined){try{PH.assets=window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){PH.assets=null}}return PH.assets}
function exifRead(buf){
  try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return {};let o=2;
    while(o<v.byteLength-4){const m=v.getUint16(o);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return parseTiff(v,o+10);if((m&0xFF00)!==0xFF00)break;o+=2+v.getUint16(o+2)}
  }catch(e){}return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
  const ifd=p=>{const n=g16(p),r={};for(let i=0;i<n;i++){const e=p+2+i*12;r[g16(e)]={type:g16(e+2),count:g32(e+4),off:e+8}}return r};
  const val=en=>{if(!en)return null;const sz={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8}[en.type]||1;const p=sz*en.count>4?t+g32(en.off):en.off;
    if(en.type===2){let s='';for(let i=0;i<en.count-1;i++)s+=String.fromCharCode(v.getUint8(p+i));return s}
    if(en.type===5){const a=[];for(let i=0;i<en.count;i++)a.push(g32(p+i*8)/(g32(p+i*8+4)||1));return a}
    if(en.type===3)return g16(p);if(en.type===4)return g32(p);if(en.type===1||en.type===7)return v.getUint8(p);return null};
  const out={},i0=ifd(t+g32(t+4));
  if(i0[0x8769]){const ex=ifd(t+val(i0[0x8769]));out.dt=val(ex[0x9003])}
  if(!out.dt&&i0[0x0132])out.dt=val(i0[0x0132]);
  if(out.dt){const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(out.dt);out.dt=m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`:null}
  if(i0[0x8825]){const gp=ifd(t+val(i0[0x8825]));const la=val(gp[2]),lo=val(gp[4]);
    if(la&&lo){const d=a=>a[0]+a[1]/60+a[2]/3600;let lat=d(la),lng=d(lo);if(val(gp[1])==='S')lat=-lat;if(val(gp[3])==='W')lng=-lng;if(lat||lng)out.gps={lat:r6(lat),lng:r6(lng),src:'exif'}}}
  return out;
}
const r6=v=>Math.round(v*1e6)/1e6;
function distM(a,b){if(!a||!b)return null;const R=6371000,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);
  const x=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))}
const mapUrl=g=>`https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lng}#map=18/${g.lat}/${g.lng}`;
function getGeo(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:r6(p.coords.latitude),lng:r6(p.coords.longitude),acc:Math.round(p.coords.accuracy),src:'device',at:new Date().toISOString()}),()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}
async function locateNow(){

async function addPhotos(files){

async function stampPhoto(x,g,p,no){
  const bm=await createImageBitmap(x.file);const s=Math.min(1,1600/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const ctx=c.getContext('2d');ctx.drawImage(bm,0,0,c.width,c.height);
  const fs=Math.max(14,Math.round(c.width/52)),pad=fs*.6,lines=[`${no} · ${p.name}`,`${(x.taken||new Date().toISOString().slice(0,16)).replace('T',' ')}${g?`  ·  ${g.lat}, ${g.lng}`:'  ·  بدون موقع'}`];
  const bh=lines.length*fs*1.35+pad*1.4;ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,c.height-bh,c.width,bh);
  ctx.fillStyle='#fff';ctx.font=`500 ${fs}px "IBM Plex Sans Arabic",Tahoma,sans-serif`;ctx.textAlign='right';ctx.direction='rtl';
  lines.forEach((t,i)=>ctx.fillText(t,c.width-pad,c.height-bh+pad+fs*(i+1)*1.25-fs*.2));

}
async function uploadPhotos(p,no,g){

  return out;
}

function evidence(p,w){
  const ev=[];
  if(!w.photos){ev.push(['','تقرير سابق لتفعيل إلزام الصور']);return ev}
  if(w.photos.some(x=>x.local))ev.push(['warn','الصور محفوظة مؤقتاً في هذا المتصفح فقط (وضع العرض)']);
  if(w.geo){const d=p.site?distM(w.geo,p.site):null;
    if(d==null)ev.push(['warn','موقع المشروع غير محدد — لا يمكن التحقق من المسافة']);
    else if(d>(p.site.r||300))ev.push(['bad',`التقرير مرفوع على بعد ${fmt(d)} م من موقع المشروع (النطاق ${p.site.r||300} م)`]);
    else ev.push(['ok',`داخل نطاق الموقع — ${fmt(d)} م من مركز المشروع`]);
    w.photos.forEach((x,i)=>{const dd=x.gps?distM(x.gps,w.geo):null;if(dd!=null&&dd>500)ev.push(['bad',`الصورة ${i+1} ملتقطة على بعد ${fmt(dd)} م من موقع الرفع`])});
  }else ev.push([/وضع الاختبار/.test(w.geoMissing||'')?'warn':'bad','بدون موقع جغرافي — السبب: '+(w.geoMissing||'غير مذكور')]);
  w.photos.forEach((x,i)=>{if(x.taken){const age=(Date.parse(w.date)-Date.parse(x.taken.slice(0,10)))/864e5;if(age>3)ev.push(['warn',`الصورة ${i+1} ملتقطة قبل التقرير بـ ${Math.round(age)} يوم`])}});
  if(!w.photos.some(x=>x.taken))ev.push(['','لا توجد بيانات تاريخ التقاط في الصور (قد تكون لقطة شاشة أو صورة معدّلة)']);
  return ev;
}
function photoBlock(p,w){
  const ev=evidence(p,w);
  return `${w.photos&&w.photos.length?`<div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin:8px 0">${w.photos.map((x,i)=>`<a href="${h(photoSrc(x))}" target="_blank" rel="noopener" class="thumb"><img src="${h(photoSrc(x))}" alt="صورة ${i+1} من الموقع" loading="lazy"></a>`).join('')}</div>`:''}
    ${w.geo?`<p class="ro-note" style="margin:0 0 6px">📍 ${w.geo.lat}, ${w.geo.lng}${w.geo.acc?` (±${w.geo.acc} م)`:''} · ${w.geo.src==='device'?'من جهاز المهندس':'من بيانات الصورة'} · <a href="${mapUrl(w.geo)}" target="_blank" rel="noopener">الخريطة</a></p>`:''}
    ${ev.map(([c,t])=>`<div class="insight ${c}"><span class="dot"></span><span>${h(t)}</span></div>`).join('')}`;
}

function photoAct(a,b,p){
  if(a==='rmPhoto'){const x=PH.list.splice(+b.dataset.i,1)[0];if(x)URL.revokeObjectURL(x.url);paintPhotos();paintGeo();return true}
  if(a==='getGeo'){locateNow();return true}
  if(a==='siteSave'){const lat=+document.getElementById('siteLat').value,lng=+document.getElementById('siteLng').value,r=+document.getElementById('siteR').value||300;
    if(!(Math.abs(lat)<=90&&Math.abs(lng)<=180&&(lat||lng))){toast('أدخل إحداثيات صحيحة');return true}
    p.site={lat:r6(lat),lng:r6(lng),r};logA(p,'cfg','موقع المشروع',null,`${lat}, ${lng} · نطاق ${r} م`,true);saveProject();toast('حُفظ موقع المشروع');render();return true}
  if(a==='siteHere'){toast('جارٍ تحديد موقعك…');getGeo().then(g=>{if(!g){toast('تعذّر تحديد الموقع من هذا الجهاز');return}
    p.site={lat:g.lat,lng:g.lng,r:(p.site&&p.site.r)||300};logA(p,'cfg','موقع المشروع',null,`${g.lat}, ${g.lng} من الجهاز`,true);saveProject();toast('حُفظ موقع المشروع');render()});return true}
  if(a==='siteFromW'){const w=p.works.find(x=>x.id===b.dataset.id);if(w&&w.geo){p.site={lat:w.geo.lat,lng:w.geo.lng,r:(p.site&&p.site.r)||300};logA(p,'cfg','موقع المشروع',null,'من تقرير '+w.no,true);saveProject();toast('اعتُمد موقع التقرير كموقع للمشروع');render()}return true}
  return false;
}

/* ---------- الأوامر التغييرية ---------- */
const COST={submitted:['warn','بانتظار مراجعة مدير المشروع'],owner:['warn','بانتظار اعتماد المالك'],approved:['ok','معتمد — طُبّق على العقد'],rejected:['bad','مرفوض']};
const CO_REASONS=['طلب المالك','تعديل في التصميم أو خطأ في المخططات','ظروف موقع غير متوقعة','متطلبات جهة رسمية','هندسة قيمية (توفير)','أخرى'];
let coDraft=null;
const coValue=co=>r2(co.lines.reduce((s,l)=>s+(+l.qty||0)*(+l.rate||0),0));
function ctrValue(p,cid){const c=ctr(p,cid);const app=p.cos.filter(x=>x.contractor===cid&&x.status==='approved').reduce((s,x)=>s+x.value,0);
  const pend=p.cos.filter(x=>x.contractor===cid&&(x.status==='submitted'||x.status==='owner')).reduce((s,x)=>s+x.value,0);
  return {orig:+c.value||0,app:r2(app),pend:r2(pend),rev:r2((+c.value||0)+app),pct:c.value?app/c.value*100:null}}
function newCoDraft(p){return {contractor:(p.contractors[0]||{}).id||'',title:'',reason:CO_REASONS[0],just:'',days:0,lines:[{kind:'boq',key:(p.items[0]||{}).key||'',desc:'',unit:'',qty:0,rate:0}]}}
function coLineRate(p,d,l){if(l.kind==='boq'&&!(+l.rate>0)){const r=lastRate(p,d.contractor,l.key)[0];return r||0}return +l.rate||0}
function coForm(p){
  if(!p.contractors.length)return '<div class="panel empty"><b>لا يوجد مقاولون</b>أضف مقاولاً أولاً من تبويب «المقاولون والضمانات».</div>';
  const d=coDraft||(coDraft=newCoDraft(p));
  const rows=d.lines.map((l,i)=>`<tr><td><select class="field sel-sm" data-coline="${i}:kind"><option value="boq" ${l.kind==='boq'?'selected':''}>بند من الجدول</option><option value="new" ${l.kind==='new'?'selected':''}>بند جديد</option></select></td>
    <td style="min-width:200px">${l.kind==='boq'?`<select class="field sel-sm" style="width:100%" data-coline="${i}:key">${p.items.map(it=>`<option value="${it.key}" ${it.key===l.key?'selected':''}>${PRICES[it.key].name}</option>`).join('')}</select>`:`<input class="field sel-sm" style="width:100%" data-coline="${i}:desc" value="${h(l.desc)}" placeholder="وصف البند الجديد">`}</td>
    <td>${l.kind==='boq'?`<span class="ro-note">${PRICES[l.key]?PRICES[l.key].unit:''}</span>`:`<input class="field sel-sm" style="width:70px" data-coline="${i}:unit" value="${h(l.unit)}" placeholder="م²">`}</td>
    <td><input class="price-in" data-coline="${i}:qty" type="number" step="0.01" value="${l.qty||''}" placeholder="+ إضافة / − حذف"></td>
    <td><input class="price-in" data-coline="${i}:rate" type="number" step="0.01" min="0" value="${l.rate||''}" placeholder="${l.kind==='boq'?(lastRate(p,d.contractor,l.key)[0]||'سعر'):'سعر'}"></td>
    <td class="n num" id="col-${i}">${fmt((+l.qty||0)*coLineRate(p,d,l))}</td><td>${d.lines.length>1?`<button type="button" class="btn sm" data-act="coDelLine" data-i="${i}">حذف</button>`:''}</td></tr>`).join('');
  return `<div class="panel"><h2>طلب أمر تغييري جديد</h2><div class="grid g2">
    <div class="form"><label class="ro-note">المقاول</label><select class="field" data-co="contractor">${p.contractors.map(c=>`<option value="${c.id}" ${c.id===d.contractor?'selected':''}>${h(c.name)}</option>`).join('')}</select></div>
    <div class="form"><label class="ro-note">العنوان</label><input class="field" data-co="title" value="${h(d.title)}" placeholder="مثال: إضافة مظلات مواقف السيارات"></div>
    <div class="form"><label class="ro-note">سبب التغيير</label><select class="field" data-co="reason">${CO_REASONS.map(r=>`<option ${r===d.reason?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="form"><label class="ro-note">الأثر على المدة (أيام)</label><input class="field num" data-co="days" type="number" step="1" value="${d.days||0}"></div></div>
    <textarea class="field" style="margin-top:10px" data-co="just" placeholder="المبررات الفنية (إلزامي)">${h(d.just)}</textarea>
    <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>النوع</th><th>البند</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>القيمة</th><th></th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="5">إجمالي قيمة الأمر التغييري (قبل الضريبة)</td><td class="n num" id="coTot">${fmt(d.lines.reduce((s,l)=>s+(+l.qty||0)*coLineRate(p,d,l),0))}</td><td></td></tr></tfoot></table></div>
    <div class="row-btns"><button type="button" class="btn" data-act="coAddLine">+ بند</button><button type="button" class="btn primary" data-act="coSubmit">إرسال للاعتماد</button></div>
    <p class="ro-note" style="margin:8px 0 0">الكمية السالبة = حذف أعمال. سعر بند الجدول الفارغ يؤخذ من عقد المقاول. بعد الاعتماد النهائي تُعدَّل قيمة العقد وكميات جدول الكميات، ويظهر البند الجديد في تقارير الاستلام.</p></div>`;
}
function coCard(p,co){
  const c=ctr(p,co.contractor),v=ctrValue(p,co.contractor);const pmAct=co.status==='submitted'&&can('coApprove'),ownAct=co.status==='owner'&&can('coOwner');
  return `<details class="how" ${pmAct||ownAct?'open':''} style="background:var(--surface)"><summary><span class="num">${h(co.no)}</span> · ${h(co.title)} · ${h(c.name)} · <b class="num">${co.value>0?'+':''}${fmt(co.value)}</b> ر.س <span class="chip ${COST[co.status][0]}">${COST[co.status][1]}</span></summary>
    <div class="inv-meta" style="margin-top:10px"><div><span>السبب</span><b>${h(co.reason)}</b></div><div><span>الأثر على المدة</span><b class="num">${co.days||0} يوم</b></div><div><span>قيمة العقد الحالية</span><b class="num">${fmt(v.rev)}</b></div><div><span>بعد الاعتماد</span><b class="num">${fmt(v.rev+(co.status==='approved'?0:co.value))}${v.orig?` (${fmt(((v.rev+(co.status==='approved'?0:co.value))/v.orig-1)*100,1)}%)`:''}</b></div></div>
    <p style="margin:0 0 8px">${h(co.just)}</p>
    <div class="tbl-wrap"><table><thead><tr><th>البند</th><th>الوحدة</th><th>الكمية</th><th>السعر</th><th>القيمة</th></tr></thead><tbody>${co.lines.map(l=>`<tr><td>${h(l.kind==='boq'&&PRICES[l.key]?PRICES[l.key].name:l.desc)}${l.kind==='new'?' <span class="chip ai">جديد</span>':''}</td><td>${h(l.kind==='boq'&&PRICES[l.key]?PRICES[l.key].unit:l.unit)}</td><td class="n num">${fmt(l.qty,2)}</td><td class="n num">${fmt(l.rate,2)}</td><td class="n num">${fmt(l.qty*l.rate)}</td></tr>`).join('')}</tbody></table></div>
    <p class="ro-note" style="margin:8px 0 0">رفعه ${h(co.by)} في ${h(co.date)}${co.pmDate?` · راجعه مدير المشروع ${h(co.pmDate)}`:''}${co.ownerDate?` · اعتمده المالك ${h(co.ownerDate)}`:''}${co.note?` · ملاحظة: ${h(co.note)}`:''}</p>
    ${pmAct||ownAct?`<input class="field" id="con-${co.id}" placeholder="ملاحظة (إلزامية عند الرفض)" style="margin-top:8px"><div class="row-btns"><button class="btn primary" data-act="coApprove" data-id="${co.id}">${pmAct?(Math.abs(co.value)>LIMITS.co?'اعتماد ورفع للمالك':'اعتماد نهائي'):'اعتماد المالك النهائي'}</button><button class="btn" data-act="coReject" data-id="${co.id}">رفض</button></div>`:''}</details>`;
}
function wCO(p){
  const sum=p.contractors.map(c=>{const v=ctrValue(p,c.id);return `<tr><td>${h(c.name)}</td><td class="n num">${v.orig?fmt(v.orig):'—'}</td><td class="n num" style="${v.app<0?'color:var(--ok)':''}">${v.app>0?'+':''}${fmt(v.app)}</td><td class="n num" style="font-weight:600">${v.orig?fmt(v.rev):'—'}</td><td>${v.pct!=null?`<span class="chip ${Math.abs(v.pct)>10?'bad':Math.abs(v.pct)>5?'warn':''}"><span class="num">${v.pct>0?'+':''}${fmt(v.pct,1)}%</span></span>`:'—'}</td><td class="n num">${v.pend?fmt(v.pend):'—'}</td></tr>`}).join('');
  const list=p.cos.slice().reverse();const mine=list.filter(x=>(x.status==='submitted'&&can('coApprove'))||(x.status==='owner'&&can('coOwner')));
  return `<div class="panel"><h2>قيمة العقود بعد الأوامر التغييرية</h2><div class="tbl-wrap"><table><thead><tr><th>المقاول</th><th>قيمة العقد الأصلية</th><th>أوامر معتمدة</th><th>القيمة المعدّلة</th><th>نسبة التغيير</th><th>قيد الاعتماد</th></tr></thead><tbody>${sum}</tbody></table></div>
    <p class="ro-note" style="margin:10px 0 0">دورة الاعتماد: المهندس أو مدير المشروع يرفع ← مدير المشروع يراجع ← المالك يعتمد إذا تجاوزت القيمة ${sar(LIMITS.co)} أو إذا رفعه مدير المشروع نفسه. نسبة تغيير فوق 10% تظهر بالأحمر.</p></div>
    ${mine.length?`<div class="panel" style="border-color:var(--warn)"><h2>بانتظار اعتمادك <span class="chip warn">${mine.length}</span></h2>${mine.map(co=>coCard(p,co)).join('')}</div>`:''}
    ${can('coCreate')?coForm(p):''}
    <div class="panel"><h2>سجل الأوامر التغييرية <span class="chip">${p.cos.length}</span></h2>${list.filter(x=>!mine.includes(x)).map(co=>coCard(p,co)).join('')||'<p class="ro-note">لا توجد أوامر تغييرية.</p>'}</div>`;
}
function coApply(p,co){
  const c=p.contractors.find(x=>x.id===co.contractor);c.rates=c.rates||{};let np=false;
  co.lines.forEach(l=>{
    if(l.kind==='boq'){const it=p.items.find(x=>x.key===l.key);if(it)it.coQty=r2((it.coQty||0)+l.qty);if(l.rate>0&&!(+c.rates[l.key]>0))c.rates[l.key]=l.rate}
    else{const key='co_'+uid();PRICES[key]={name:l.desc,unit:l.unit||'مقطوعية',price:l.rate,cat:'أوامر تغييرية',trend:0,co:true,src:{no:co.no,date:today()}};
      p.items.push({key,qty:p.floors.map(()=>0),coQty:r2(l.qty),bought:0,co:co.no});c.rates[key]=l.rate;l.key=key;np=true}});
  co.status='approved';co.appliedDate=today();if(np)savePrices();
}
function coAct(a,b,p){
  if(a==='coAddLine'){coDraft.lines.push({kind:'boq',key:(p.items[0]||{}).key||'',desc:'',unit:'',qty:0,rate:0});render();return true}
  if(a==='coDelLine'){coDraft.lines.splice(+b.dataset.i,1);render();return true}
  if(a==='coSubmit'){const d=coDraft;
    if(!d.title.trim()||!d.just.trim()){toast('أدخل العنوان والمبررات الفنية');return true}
    const lines=d.lines.map(l=>({kind:l.kind,key:l.kind==='boq'?l.key:'',desc:l.kind==='new'?l.desc.trim():'',unit:l.kind==='new'?l.unit.trim():'',qty:+l.qty||0,rate:coLineRate(p,d,l)}));
    if(lines.some(l=>!l.qty)){toast('أدخل كمية لكل بند (موجبة للإضافة، سالبة للحذف)');return true}
    if(lines.some(l=>l.kind==='new'&&(!l.desc||!(l.rate>0)))){toast('البند الجديد يحتاج وصفاً وسعراً');return true}
    if(lines.some(l=>!(l.rate>0))){toast('لا يوجد سعر عقد لأحد البنود — أدخل السعر');return true}
    const co={id:uid(),no:nextNo(p.cos,'VO-'),contractor:d.contractor,title:d.title.trim(),reason:d.reason,just:d.just.trim(),days:+d.days||0,lines,date:today(),by:ROLES[state.role].name,byKey:actorKey()};
    co.value=coValue(co);co.status=can('coApprove')?'owner':'submitted';if(co.status==='owner')co.pmDate=today();
    p.cos.push(co);logA(p,'co.submit',co.no,co.value,`${co.title} · ${ctr(p,co.contractor).name} · ${co.reason}${co.days?` · ${co.days} يوم`:''}`);
    coDraft=null;saveProject();toast(co.status==='owner'?`أُرسل ${co.no} للمالك مباشرة (رفعه مدير المشروع)`:`أُرسل ${co.no} لمدير المشروع`);render();return true}
  const co=p.cos.find(x=>x.id===b.dataset.id);if(!co)return false;const note=((document.getElementById('con-'+co.id)||{}).value||'').trim();
  if(a==='coApprove'){
    if(co.status==='submitted'&&can('coApprove')){if(sodBlock(p,co.byKey,co.no,'اعتماد أمر تغييري رفعه نفس المستخدم'))return true;
      co.pmDate=today();if(note)co.note=note;logA(p,'co.pm',co.no,co.value,note);

/* ---------- أعمال الموقع والمستخلصات: استلام ← اعتماد ← مستحقات ← صرف ← سداد ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function ensureW(p){if(!p)return p;p.contractors=p.contractors||[];p.works=p.works||[];p.payments=p.payments||[];p.releases=p.releases||[];p.ctrHolds=p.ctrHolds||[];p.invPending=p.invPending||[];p.audit=p.audit||[];p.cos=p.cos||[];p.opcs=p.opcs||[];
  if(!p.baseline&&p.items&&p.items.length){freezeBaseline(p,'linear');p.baseline.auto=true}
  return p}
const WST={submitted:['warn','بانتظار اعتماد مدير المشروع'],approved:['ai','معتمدة — مستحقة'],inpay:['ai','في طلب صرف'],paid:['ok','مدفوعة'],rejected:['bad','مرفوضة — تحتاج تصحيح']};
const PST={requested:['warn','بانتظار اعتماد مدير المشروع'],owner:['warn','بانتظار اعتماد المالك'],approved:['ai','معتمد — بانتظار السداد'],paid:['ok','مسدد'],rejected:['bad','مرفوض']};
const HOLD_T=['ضمان حسن تنفيذ','غرامة تأخير','خصم مواد موردة من المالك','خصم إصلاح عيوب','أخرى'];
const ctr=(p,id)=>p.contractors.find(c=>c.id===id)||{name:'—',ret:0,vat:false,rates:{}};
const itemName=w=>w.key&&PRICES[w.key]?PRICES[w.key].name:(w.desc||'أعمال أخرى');
const nextNo=(arr,pre)=>pre+String(arr.length+1).padStart(3,'0');
function workCalc(p,w){
  const c=ctr(p,w.contractor),q=w.aQty!=null?w.aQty:w.qty;
  const gross=r2(q*(+w.rate||0)),vat=c.vat?r2(gross*.15):0,ret=r2(gross*(w.retPct!=null?w.retPct:c.ret||0)/100);
  const holds=r2((w.holds||[]).reduce((s,x)=>s+(+x.amount||0),0));
  return {q,gross,vat,ret,holds,net:r2(gross+vat-ret-holds)};
}
function execByItem(p,key,statuses){return p.works.filter(w=>w.key===key&&statuses.includes(w.status)).reduce((s,w)=>s+(w.aQty!=null?w.aQty:w.qty),0)}
function ledger(p,cid){
  const ws=p.works.filter(w=>w.contractor===cid&&['approved','inpay','paid'].includes(w.status));
  const L={gross:0,vat:0,ret:0,holds:0,net:0,paid:0,inpay:0,due:0,relReleased:0,ctrHolds:0};
  ws.forEach(w=>{const c=w.calc||workCalc(p,w);L.gross+=c.gross;L.vat+=c.vat;L.ret+=c.ret;L.holds+=c.holds;L.net+=c.net;
    if(w.status==='paid')L.paid+=c.net;else if(w.status==='inpay')L.inpay+=c.net;else L.due+=c.net});
  p.releases.filter(r=>r.contractor===cid).forEach(r=>{L.relReleased+=r.amount;if(r.status==='paid')L.paid+=r.amount;else if(r.status==='inpay')L.inpay+=r.amount;else L.due+=r.amount});
  p.ctrHolds.filter(x=>x.contractor===cid&&x.status!=='released').forEach(x=>{L.ctrHolds+=x.amount;if(x.status==='open')L.due-=x.amount});
  L.retHeld=L.ret+L.holds+L.ctrHolds-L.relReleased;
  return L;
}
function tasks(){
  const p=P(),t={works:0,invoices:0,list:[]};if(!p)return t;ensureW(p);
  const add=(n,txt,view,tab)=>{if(!n)return;t[view]=(t[view]||0)+n;t.list.push([txt.replace('#',n),view,tab])};
  if(can('approveWork')) add(p.works.filter(w=>w.status==='submitted').length,'# تقرير استلام أعمال بانتظار اعتمادك','works','approve');
  if(can('payApprove')) add(p.payments.filter(x=>x.status==='requested').length,'# طلب صرف للمقاولين بانتظار اعتمادك','works','approve');
  if(can('payOwner')) add(p.payments.filter(x=>x.status==='owner').length,'# دفعة فوق حد الصلاحية بانتظار اعتمادك','works','approve');
  if(can('coApprove')) add(p.cos.filter(x=>x.status==='submitted').length,'# أمر تغييري بانتظار مراجعتك','works','co');
  if(can('coOwner')) add(p.cos.filter(x=>x.status==='owner').length,'# أمر تغييري بانتظار اعتمادك النهائي','works','co');
  if(can('opcApprove')) add((p.opcs||[]).filter(x=>x.status==='requested').length,'# مستخلص مالك بانتظار اعتمادك','owner');
  if(can('opcClient')) add((p.opcs||[]).filter(x=>x.status==='client').length,'# مستخلص مقدَّم لكم بانتظار الاعتماد','owner');
  if(can('opcBill')) add((p.opcs||[]).filter(x=>x.status==='approved').length,'# مستخلص مالك معتمد بانتظار التحصيل','owner');
  if(can('payReq')) add(p.works.filter(w=>w.status==='approved').length+p.releases.filter(r=>r.status==='due').length,'# مستحق معتمد لم يُدرج في طلب صرف','works','dues');
  if(can('payRecord')) add(p.payments.filter(x=>x.status==='approved').length,'# دفعة معتمدة بانتظار تسجيل السداد','works','dues');
  if(can('submitWork')&&!can('approveWork')) add(p.works.filter(w=>w.status==='rejected').length,'# تقرير أعمال مرفوض يحتاج تصحيحاً','works','submit');
  if(can('team')&&realAccounts()&&ACC.members&&ACC.me.canEdit) add(Object.keys(ACC.requests).filter(id=>!ACC.members[id]).length,'# طلب انضمام بانتظار التفعيل','team');
  if(can('approveInv')) add(p.invPending.length+invQueue.filter(x=>x.pid===state.project&&x.stage==='review').length,'# فاتورة مورد بانتظار مراجعتك','invoices');
  return t;
}

  return kp+`<div class="panel"><h2>الكميات المنفذة مقابل جدول الكميات</h2>${rows?`<div class="tbl-wrap"><table><thead><tr><th>البند</th><th>الوحدة</th><th>كمية الجدول</th><th>المنفذ المعتمد</th><th>نسبة التنفيذ</th><th>بانتظار الاعتماد</th><th>متوسط سعر التنفيذ</th><th>تكلفة التنفيذ (ر.س)</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="ro-note">لم تُعتمد أعمال منفذة بعد.</p>'}

function lastRate(p,cid,key){const c=ctr(p,cid);if(key&&c.rates&&+c.rates[key]>0)return [+c.rates[key],'سعر العقد'];

function workAct(a,b,p){

    Object.assign(w,{aQty:+d.aQty,rate:+d.rate,retPct:+d.retPct,holds:d.holds.filter(x=>+x.amount>0).map(x=>({type:x.type,amount:+x.amount,reason:x.reason})),pmNote:d.note,pmDate:today(),pmBy:ROLES[state.role].name,status:'approved'});

    logA(p,'work.approve',w.no,w.calc.net,`${itemName(w)} · ${ctr(p,w.contractor).name}${chg.length?' — '+chg.join(' · '):''}`,chg.length>0);saveProject();toast(`اعتُمد ${w.no} — ظهر لدى المحاسب كمستحق ${sar(w.calc.net)}`);render();return true}
  if(a==='rejectW'){const d=draftOf(p,w);if(!d.note.trim()){toast('اكتب سبب الرفض في خانة الملاحظة');return true}

function umAct(a,b){
  const A=window.bannaaAdmin;if(!A||!a||!a.startsWith('um'))return false;
  const done=(msg)=>{toast(msg);UM.list=null;umLoad()};const fail=e=>toast({domain_not_allowed:'البريد خارج نطاق الشركة',bad_request:'تحقق من البيانات',permission_denied:'لا تملك الصلاحية',exists:'المستخدم موجود مسبقاً'}[e&&e.code]||'تعذّر تنفيذ العملية');
  if(a==='umRefresh'){UM.list=null;umLoad();return true}
  if(a==='umAdd'){const email=lc(document.getElementById('umEmail').value),name=document.getElementById('umName').value.trim(),role=document.getElementById('umRole').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('أدخل بريداً صحيحاً');return true}
    if(domains().length&&!domainOk(email)){toast('البريد خارج نطاق الشركة: '+domains().map(d=>'@'+d).join('، '));return true}
    b.disabled=true;A.create({email,name,role}).then(r=>done(r.mail?`أُضيف ${email} وأُرسل له بريد الترحيب`:`أُضيف ${email} — لم يُرسل بريد الترحيب، أبلغه بالرابط`)).catch(fail).finally(()=>{b.disabled=false});return true}
  if(a==='umReset'){A.reset(b.dataset.id).then(()=>done('أُرسل رمز إعادة تعيين كلمة المرور إلى بريد المستخدم')).catch(fail);return true}
  if(a==='umDisable'){A.setStatus(b.dataset.id,false).then(()=>done('أُوقف الحساب')).catch(fail);return true}
  if(a==='umEnable'){A.setStatus(b.dataset.id,true).then(()=>done('فُعّل الحساب')).catch(fail);return true}
  if(a==='umDomains'){const ds=[...new Set(document.getElementById('domIn').value.split(/[\s,،;]+/).map(x=>lc(x).replace(/^@/,'')).filter(x=>/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(x)))];
    A.domains(ds).then(()=>done('حُفظ نطاق البريد')).catch(fail);return true}
  return false;
}

function sendInvForApproval(p,inv){
  const keep=['id','pid','file','no','vendor','vendorOk','date','dateOk','vat','total','totalRead','lines','notes','hash','dup','issues','demo'];
  const o={};keep.forEach(k=>{if(inv[k]!==undefined)o[k]=clone(inv[k])});Object.assign(o,{persisted:true,stage:'review',sentBy:ROLES[state.role].name,sentAt:today()});
  o.byKey=actorKey();p.invPending.push(o);logA(p,'inv.send',inv.no,inv.total,inv.vendor);inv.stage='done';inv.reason='أُرسلت لمدير المشروع والمحاسب للاعتماد';if(inv.url)URL.revokeObjectURL(inv.url);inv.url=null;inv.raw=null;
  if(!invQueue.includes(inv))invQueue.push(inv);saveProject(inv.pid);toast('أُرسلت الفاتورة للاعتماد');render();
}
function dropInv(inv){
  if(inv.stage==='review'||inv.persisted)logA(state.projects[inv.pid],'inv.drop',inv.no||inv.file,inv.total,inv.dup?'مكررة: '+inv.dup.why:'',!!inv.dup||inv.persisted);
  if(inv.persisted){const p=state.projects[inv.pid];p.invPending=p.invPending.filter(x=>x.id!==inv.id);saveProject(inv.pid)}
  else{if(inv.url)URL.revokeObjectURL(inv.url);invQueue=invQueue.filter(x=>x!==inv)}
}

/* ---------- الحفظ ---------- */
const store={db:null,queues:{}};
const clone=o=>JSON.parse(JSON.stringify(o));
function setStatus(s){
  const el=document.getElementById('saveState');el.dataset.s=s;
  el.lastElementChild.textContent={saved:'كل التغييرات محفوظة',saving:'جارٍ الحفظ…',error:'تعذّر الحفظ — أعد المحاولة',local:'الحفظ غير متاح هنا — وضع تجريبي',connecting:'جارٍ الاتصال بالحفظ…'}[s];
}
function persist(path,data){
  if(!store.db){toast('الحفظ غير متاح في هذا العرض — التغيير مؤقت');return}
  setStatus('saving');
  // كتابة واحدة في كل مرة لكل مستند
  const run=()=>store.db.doc(path).set(data).catch(e=>{
    if(e&&e.code==='unavailable') return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(()=>store.db.doc(path).set(data));
    throw e});
  store.queues[path]=(store.queues[path]||Promise.resolve()).then(run).then(()=>setStatus('saved')).catch(e=>{
    setStatus('error');toast(e&&e.code==='quota_exceeded'?'امتلأت مساحة الحفظ — احذف بيانات قديمة':'تعذّر حفظ التغيير، حاول مرة أخرى')});
}

  const inf=document.getElementById('invFile');if(inf) inf.onchange=e=>{const fs=[...e.target.files];if(fs.length) enqueueInvoices(fs)};
  document.querySelectorAll('.drop').forEach(d=>{
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const fs=[...e.dataTransfer.files];if(!fs.length)return;d.querySelector('#drawFile')?startDrawings(fs):enqueueInvoices(fs)};
  });

    state.projects[id]={name:v('npName').value.trim(),loc:v('npLoc').value.trim()||'—',progress:0,start:v('npStart').value||'—',end:v('npEnd').value||'—',
      scale:r1((+v('npArea').value||310)/310),annex,floors:floorNames(typ,annex),items:[],drawings:[],invoices:[],reports:[]};
    state.project=id;state.view='drawings';logA(state.projects[id],'project',state.projects[id].name,null,'');saveProject(id);toast('تم إنشاء المشروع — ارفع المخططات الآن');render()};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-role],[data-view],[data-floor],[data-act],[data-wtab],[data-pkey],[data-acat]');if(!b)return;
  if(b.dataset.acat){aState().cat=b.dataset.acat;render();return}
  if(b.dataset.wtab&&!b.dataset.view){state.wtab=b.dataset.wtab;render();return}
  if(b.dataset.pkey){state.priceKey=b.dataset.pkey;render();return}
  if(b.dataset.role){if(!canSwitch())return;state.role=b.dataset.role;toast('تم التبديل إلى: '+ROLES[state.role].name);render();return}
  if(b.dataset.view){state.view=b.dataset.view;if(b.dataset.wtab)state.wtab=b.dataset.wtab;render();window.scrollTo(0,0);return}
  if(b.dataset.floor){state.floorTab=b.dataset.floor;render();return}
  const a=b.dataset.act,p=P();
  if(a==='loadDemo'){loadDemo();return}
  if(umAct(a,b))return;
  if(teamAct(a,b))return;
  if(a==='auditCsv'){auditCsv();return}
  if(p&&(photoAct(a,b,p)||coAct(a,b,p)||opcAct(a,b,p)))return;
  if(p&&workAct(a,b,p))return;
  if(a==='readDrawings'){readDrawings();return}
  if(a==='stopAi'){if(analysis&&analysis.ctl)analysis.ctl.abort();return}
  if(a==='manualTakeoff'){analysis={stage:'review',pages:[],M:p.takeoff?clone(p.takeoff):defaultM(p),notes:[],summary:''};render();return}
  if(a==='applyTakeoff'){const an=analysis;
    an.M.forEach(m=>{if(m)MF.forEach(([k])=>{m[k]=Math.max(0,Number(m[k])||0)})});
    p.takeoff=clone(an.M);p.items=takeoff(p,an.M);
    an.pages.forEach(pg=>p.drawings.push({name:pg.name,size:(pg.blob.size/1048576).toFixed(1)+' MB',status:'تمت القراءة'}));
    if(!an.pages.length) p.drawings.push({name:'قياسات مدخلة يدوياً — '+new Date().toISOString().slice(0,10),size:'',status:'يدوي'});
    logA(p,'boq',p.name,p.items.reduce((s,it)=>s+total(it)*PRICES[it.key].price,0),an.pages.length?`من ${an.pages.length} صفحة مخططات`:'قياسات يدوية');analysis=null;saveProject();toast('تم حساب واعتماد جدول الكميات');state.view='boq';render();return}
  if(a==='cancelAnalysis'){if(analysis&&analysis.ctl)analysis.ctl.abort();analysis=null;render()}
  if(a==='demoInv'){demoInvoice();return}
  if(a==='demoDup'){demoInvoice('dup');return}
  if(a==='approveInv'){const inv=curInv();if(!inv)return;const ip=state.projects[inv.pid];
    if(inv.persisted&&can('approveInv')&&sodBlock(ip,inv.byKey,inv.no,'اعتماد فاتورة أرسلها نفس المستخدم'))return;
    if(!can('approveInv')){sendInvForApproval(ip,inv);return}
    if(!inv.no){toast('أدخل رقم الفاتورة أولاً');return}
    if(inv.dup&&inv.dup.level==='sure'&&!inv.override){toast('الفاتورة مكررة — الاعتماد موقوف');return}
    approveInvoice(ip,inv,false);toast('تم اعتماد الفاتورة وخصم الكميات');render();return}
  if(a==='cancelInv'){const inv=curInv();if(!inv)return;if(inv.ctl)inv.ctl.abort();dropInv(inv);render();return}
  if(a==='stopInv'){const inv=invQueue.find(x=>x.id===b.dataset.id);if(inv&&inv.ctl)inv.ctl.abort();return}
  if(a==='clearInv'){invQueue=invQueue.filter(x=>!(x.pid===state.project&&['done','skipped','error'].includes(x.stage)));render();return}
});

async function initAI(){
  if(!(window.claude&&window.claude.use))return;
  try{AI.sample=await window.claude.use('sample');if(AI.sample)AI.limits=await AI.sample.limits().catch(()=>null)}catch(e){AI.sample=null}
  if(['drawings','invoices'].includes(state.view))render();
}
async function boot(){
  loadPrefs();setStatus('connecting');render();initAI();initUser();
  const db=window.claude&&window.claude.use?await window.claude.use('db').catch(()=>null):null;
  ACC.dbDone=true;ACC.hasDb=!!db;
  if(!db){ // عرض بدون حفظ: نعرض البيانات التجريبية في الذاكرة
    const d=demoData();PRICES=d.prices;state.projects=d.projects;state.loaded=true;pickProject();setStatus('local');idRefresh();render();return}
  store.db=db;ACC.db=db;subscribeTeam();
  let gotProjects=false,gotPrices=false,last='';
  const done=()=>{if(!gotProjects||!gotPrices)return;
    // لا نعيد الرسم إذا لم تتغير البيانات (حتى لا يضيع ما يكتبه المستخدم)
    const sig=JSON.stringify([state.projects,PRICES,AUTO,LIMITS]);if(state.loaded&&sig===last)return;last=sig;
    state.loaded=true;pickProject();identityRole();if(document.getElementById('saveState').dataset.s==='connecting')setStatus('saved');render()};
  db.collection('projects').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{next[d.id]=clone(d.data())});state.projects=next;gotProjects=true;done()},
    e=>{if(e&&/permission|not_member/.test(e.code||'')){state.projects={};gotProjects=true;done();return}setStatus('error');toast('انقطع الاتصال بالحفظ — أعد تحميل الصفحة')});
  db.doc('settings/prices').onSnapshot(s=>{if(s.exists&&s.data().prices)PRICES=Object.assign(clone(DEFAULT_PRICES),clone(s.data().prices));if(s.exists&&s.data().auto)AUTO=Object.assign({approve:true,price:true},s.data().auto);if(s.exists&&s.data().limits)LIMITS=Object.assign({pay:100000,invAuto:50000,co:25000},s.data().limits);gotPrices=true;done()},
    ()=>{gotPrices=true;done()});
}
boot();
</script>
