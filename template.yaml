AWSTemplateFormatVersion: '2010-09-09'
Description: Bannaa construction project management platform (Alrasiyat) — static site on CloudFront, Cognito sign-in, Lambda API, DynamoDB, S3, SES, Anthropic API.

Parameters:
  OwnerEmail:
    Type: String
    Description: Email of the platform owner (full access, can set the company email domain).
  SenderEmail:
    Type: String
    Description: Verified SES sender address for invitation emails (e.g. no-reply@alrasiyat.com).
  AnthropicSecretName:
    Type: String
    Default: bannaa/anthropic
    Description: Secrets Manager secret holding the Anthropic API key (plain string).
  Model:
    Type: String
    Default: claude-sonnet-4-5
    Description: Anthropic model id for invoice reading.
  ModelComplex:
    Type: String
    Default: claude-sonnet-4-5
    Description: Anthropic model id for reading drawings.
  DomainName: { Type: String, Default: '', Description: 'Custom domain (empty = cloudfront.net address)' }
  HostedZoneId: { Type: String, Default: '' }
  CertificateArn: { Type: String, Default: '', Description: 'ACM certificate in us-east-1 (from template-edge.yaml)' }
  WebAclArn: { Type: String, Description: 'WAF web ACL (from template-edge.yaml)' }
  OriginSecret: { Type: String, NoEcho: true, MinLength: 24, Description: 'Shared secret CloudFront sends to the API' }
  CfKeyGroupId: { Type: String, Description: 'CloudFront key group used to sign photo cookies' }
  CfPublicKeyId: { Type: String }
  CfKeySecretName: { Type: String, Default: bannaa/cf-private-key }

Conditions:
  HasDomain: !Not [ !Equals [ !Ref DomainName, '' ] ]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [ { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } } ] }

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [ { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } } ] }
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:            # documents upload straight from the browser with short-lived signed URLs
        CorsRules: [ { AllowedMethods: [ PUT ], AllowedOrigins: [ '*' ], AllowedHeaders: [ '*' ], MaxAge: 3600 } ]
      LifecycleConfiguration:
        Rules:
          - { Id: tmp-ai-images, Status: Enabled, Prefix: _tmp/, ExpirationInDays: 1 }

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Bannaa platform
        WebACLId: !Ref WebAclArn
        Aliases: !If [ HasDomain, [ !Ref DomainName ], !Ref 'AWS::NoValue' ]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: assets
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [ TLSv1.2 ] }
            OriginCustomHeaders: [ { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret } ]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03   # Managed-SecurityHeadersPolicy (HSTS, nosniff, frame-options…)
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [ GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE ]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
          - PathPattern: /_blob/*
            TargetOriginId: assets
            ViewerProtocolPolicy: https-only
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            TrustedKeyGroups: [ !Ref CfKeyGroupId ]     # photos load only with the signed cookie issued after sign-in

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${AssetsBucket.Arn}/_blob/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [ { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole } ]
      ManagedPolicyArns: [ arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole ]
      Policies:
        - PolicyName: bannaa-api
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: [ dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query ], Resource: !GetAtt Table.Arn }
              - { Effect: Allow, Action: [ s3:GetObject, s3:PutObject ], Resource: !Sub '${AssetsBucket.Arn}/*' }
              - { Effect: Allow, Action: [ ses:SendEmail ], Resource: '*' }
              - { Effect: Allow, Action: [ secretsmanager:GetSecretValue ], Resource: [ !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*', !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CfKeySecretName}-*' ] }
              - { Effect: Allow, Action: [ dynamodb:ConditionCheckItem ], Resource: !GetAtt Table.Arn }
              - { Effect: Allow, Action: [ cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminGetUser, cognito-idp:AdminEnableUser, cognito-idp:AdminDisableUser, cognito-idp:AdminResetUserPassword, cognito-idp:ListUsers, cognito-idp:AdminSetUserMFAPreference ], Resource: !GetAtt UserPool.Arn }
              - { Effect: Allow, Action: [ execute-api:ManageConnections ], Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*' }
              - { Effect: Allow, Action: [ lambda:InvokeFunction ], Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api' }

  ApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: nodejs24.x
      Handler: index.handler
      Code: backend/
      MemorySize: 1024
      Timeout: 300
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          TABLE: !Ref Table
          ASSETS: !Ref AssetsBucket
          OWNER_EMAIL: !Ref OwnerEmail
          SENDER_EMAIL: !Ref SenderEmail
          SECRET_ID: !Ref AnthropicSecretName
          MODEL: !Ref Model
          MODEL_COMPLEX: !Ref ModelComplex
          USER_POOL_ID: !Ref UserPool
          ORIGIN_SECRET: !Ref OriginSecret
          CF_KEY_PAIR_ID: !Ref CfPublicKeyId
          CF_KEY_SECRET: !Ref CfKeySecretName
          WS_ENDPOINT: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/ws'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Target: !GetAtt ApiFn.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ---------- live updates (WebSocket) ----------
  WsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [ { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole } ]
      ManagedPolicyArns: [ arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole ]
      Policies:
        - PolicyName: bannaa-ws
          PolicyDocument:
            Statement: [ { Effect: Allow, Action: [ dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem ], Resource: !GetAtt Table.Arn } ]

  WsFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.ws
      Code: backend/
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt WsRole.Arn
      Environment:
        Variables: { TABLE: !Ref Table, OWNER_EMAIL: !Ref OwnerEmail }

  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-live'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFn.Arn}/invocations'

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $connect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $disconnect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $default, Target: !Sub 'integrations/${WsIntegration}' }

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ WsConnectRoute, WsDisconnectRoute, WsDefaultRoute ]
    Properties:
      ApiId: !Ref WsApi
      StageName: ws
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 200, ThrottlingRateLimit: 100 }

  WsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [ email ]
      AutoVerifiedAttributes: [ email ]
      Schema:
        - { Name: email, Required: true, Mutable: true }
        - { Name: name, Required: true, Mutable: true }
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireNumbers: true, RequireLowercase: true, RequireUppercase: false, RequireSymbols: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [ { Name: verified_email, Priority: 1 } ]
      MfaConfiguration: OPTIONAL            # each user can turn on an authenticator app from their menu
      EnabledMfas: [ SOFTWARE_TOKEN_MFA ]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true     # no self sign-up: accounts are created by the admin with an email and password
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'رمز منصة بنّاء — Bannaa code'
        EmailMessage: 'رمز التحقق الخاص بك في منصة بنّاء: {####} — Your Bannaa verification code: {####}'
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [ email ] }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: bannaa-web
      GenerateSecret: false
      ExplicitAuthFlows: [ ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH ]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - { Name: !Ref DomainName, Type: A, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Ref DomainName, Type: AAAA, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

Outputs:
  Url: { Value: !If [ HasDomain, !Sub 'https://${DomainName}/', !Sub 'https://${Distribution.DomainName}/' ] }
  DistributionId: { Value: !Ref Distribution }
  SiteBucket: { Value: !Ref SiteBucket }
  Table: { Value: !Ref Table }
  ClientId: { Value: !Ref UserPoolClient }
  UserPoolId: { Value: !Ref UserPool }
  WsUrl: { Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/ws' }
